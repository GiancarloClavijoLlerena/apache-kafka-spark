<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310">
  <rect width="1200" height="310" fill="#0d1117"/>
  <rect width="1200" height="42" fill="#21262d"/>
  <circle cx="25" cy="21" r="7" fill="#ff5f57"/><circle cx="49" cy="21" r="7" fill="#febc2e"/><circle cx="73" cy="21" r="7" fill="#28c840"/>
  <text x="105" y="27" fill="#c9d1d9" font-family="Menlo, monospace" font-size="16">Terminal - Ejercicio 1</text>
  <g font-family="Menlo, monospace" font-size="19">
    <text x="30" y="85" fill="#7ee787">$ docker compose up -d zookeeper kafka</text>
    <text x="30" y="120" fill="#c9d1d9">Container zookeeper Started</text>
    <text x="30" y="150" fill="#c9d1d9">Container kafka Started</text>
    <text x="30" y="190" fill="#7ee787">$ docker compose ps</text>
    <text x="30" y="225" fill="#c9d1d9">NAME        SERVICE     STATUS</text>
    <text x="30" y="255" fill="#c9d1d9">kafka       kafka       Up</text>
    <text x="30" y="285" fill="#c9d1d9">zookeeper   zookeeper   Up</text>
  </g>
</svg>
